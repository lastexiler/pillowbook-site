  var l = (navigator.language || "zh-Hans").toLowerCase();
  var target = "zh-Hans";

  else if (l.indexOf("zh") === 0 && /hant|tw|hk|mo/.test(l)) target = "zh-Hant";
  else if (l.indexOf("zh") !== 0) target = "en";
  location.replace(target + "/privacy.html");
})();
</script>
