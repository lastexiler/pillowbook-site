<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好友邀請你用枕書讀書</title>
<meta name="description" content="裝好枕書後貼上這串邀請碼，你的書庫多放 10 本。">
<meta property="og:title" content="好友邀請你用枕書讀書">
<meta property="og:description" content="裝好枕書後貼上這串邀請碼，你的書庫多放 10 本。">
<meta property="og:image" content="../assets/icon.png">
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" href="../assets/icon.png">
</head>
<body class="code-page">
<main>
<div class="code-card raised">
  <img class="code-icon" src="../assets/icon.png" alt="">
  <h1>好友邀請你用枕書讀書</h1>
  <p class="lead">裝好枕書後貼上這串邀請碼，你的書庫多放 10 本。</p>
  <ol class="steps" id="steps"><li><span class="step-n">1</span><div class="step-body"><p>下載枕書</p><a class="pill store" href="https://apps.apple.com/app/id6813302746">在 App Store 下載</a></div></li><li><span class="step-n">2</span><div class="step-body"><p>複製邀請碼</p><div class="code-well" id="code" translate="no"></div><button class="pill" id="copy" type="button">複製</button><p class="note" id="copy-note" hidden></p></div></li><li><span class="step-n">3</span><div class="step-body"><p>打開枕書，在「設定 › 我的 › 填寫邀請碼 / 回執碼」裡貼上</p></div></li></ol>
  <div id="missing" hidden><p class="lead">這個連結不完整，請好友重新傳送。</p><a class="pill store" href="https://apps.apple.com/app/id6813302746">在 App Store 下載</a></div>
</div>
<p class="note">在微信裡打不開 App Store 時，點右上角「···」，選「在預設瀏覽器中打開」。</p>
<p class="note">這串碼只在連結裡，不會傳送到任何伺服器。</p>
</main>
<script>
(function () {
  var raw = decodeURIComponent((location.hash || "").slice(1));
  var code = raw.toUpperCase().replace(/[^0-9A-Z]/g, "");
  var ok = code.length === 26;
  if (!ok) {
    document.getElementById("steps").hidden = true;
    document.getElementById("missing").hidden = false;
    return;
  }
  var shown = code.match(/.{1,4}/g).join("-");
  document.getElementById("code").textContent = shown;
  var button = document.getElementById("copy"), note = document.getElementById("copy-note");
  function done() { button.textContent = "已複製"; setTimeout(function () { button.textContent = "複製"; }, 1600); }
  function fallback() {
    var area = document.createElement("textarea");
    area.value = shown; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
    document.body.appendChild(area); area.select(); area.setSelectionRange(0, shown.length);
    var copied = false;
    try { copied = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(area);
    if (copied) done(); else { note.textContent = "請長按上面的碼手動複製"; note.hidden = false; }
  }
  button.addEventListener("click", function () {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(shown).then(done, fallback);
    else fallback();
  });
})();
</script>
</body>
</html>
