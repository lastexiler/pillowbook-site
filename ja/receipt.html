<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>友だちが「まくらと本」の招待を受けてくれました</title>
<meta name="description" content="この受領コードをまくらと本に貼り付けると、あなたの本棚に入れられる本も増えます。">
<meta property="og:title" content="友だちが「まくらと本」の招待を受けてくれました">
<meta property="og:description" content="この受領コードをまくらと本に貼り付けると、あなたの本棚に入れられる本も増えます。">
<meta property="og:image" content="../assets/icon.png">
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" href="../assets/icon.png">
</head>
<body class="code-page">
<main>
<div class="code-card raised">
  <img class="code-icon" src="../assets/icon.png" alt="">
  <h1>友だちが「まくらと本」の招待を受けてくれました</h1>
  <p class="lead">この受領コードをまくらと本に貼り付けると、あなたの本棚に入れられる本も増えます。</p>
  <ol class="steps" id="steps"><li><span class="step-n">1</span><div class="step-body"><p>受領コードをコピー</p><div class="code-well" id="code" translate="no"></div><button class="pill" id="copy" type="button">コピー</button><p class="note" id="copy-note" hidden></p></div></li><li><span class="step-n">2</span><div class="step-body"><p>まくらと本を開いて、「設定 › マイページ › 招待コード / 受領コードを入力」に貼り付け</p></div></li></ol>
  <div id="missing" hidden><p class="lead">このリンクは不完全です。友だちにもう一度送ってもらってください。</p></div>
</div>

<p class="note">コードはこのリンクの中にだけあり、サーバーに送信されることはありません。</p>
</main>
<script>
(function () {
  var raw = decodeURIComponent((location.hash || "").slice(1));
  var code = raw.toUpperCase().replace(/[^0-9A-Z]/g, "");
  var ok = code.length === 42;
  if (!ok) {
    document.getElementById("steps").hidden = true;
    document.getElementById("missing").hidden = false;
    return;
  }
  var groups = code.match(/.{1,4}/g), shown = groups.join("-");
  // A break opportunity after every hyphen, never inside a group: some
  // browsers (WeChat's, 2026-10-17) will not break at the hyphen by themselves.
  var well = document.getElementById("code");
  groups.forEach(function (g, i) {
    well.appendChild(document.createTextNode(g + (i < groups.length - 1 ? "-" : "")));
    if (i < groups.length - 1) well.appendChild(document.createElement("wbr"));
  });
  var button = document.getElementById("copy"), note = document.getElementById("copy-note");
  function done() { button.textContent = "コピーしました"; setTimeout(function () { button.textContent = "コピー"; }, 1600); }
  function fallback() {
    var area = document.createElement("textarea");
    area.value = shown; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
    document.body.appendChild(area); area.select(); area.setSelectionRange(0, shown.length);
    var copied = false;
    try { copied = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(area);
    if (copied) done(); else { note.textContent = "上のコードを長押ししてコピーしてください"; note.hidden = false; }
  }
  button.addEventListener("click", function () {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(shown).then(done, fallback);
    else fallback();
  });
})();
</script>
</body>
</html>
